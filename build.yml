name: build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Priprema projekta
        run: bash tools/prepare.sh android
      - name: Analiza koda (informativno)
        working-directory: build_app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release --split-per-abi
      - name: Skupi APK-ove
        run: |
          mkdir -p out
          D=build_app/build/app/outputs/flutter-apk
          cp $D/app-armeabi-v7a-release.apk out/stb-player-android-armv7.apk
          cp $D/app-arm64-v8a-release.apk out/stb-player-android-arm64.apk
          cp $D/app-x86_64-release.apk out/stb-player-android-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Priprema projekta
        shell: bash
        run: bash tools/prepare.sh windows
      - name: Build Windows
        working-directory: build_app
        run: flutter build windows --release
      - name: ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path build_app/build/windows/x64/runner/Release/* -DestinationPath out/stb-player-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
